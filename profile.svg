<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500' width='500' height='500'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#2B1C11'/>
      <stop offset='50%' stop-color='#23160B'/>
      <stop offset='100%' stop-color='#160D06'/>
    </linearGradient>
    <linearGradient id='goldGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#EDECE9'/>
      <stop offset='50%' stop-color='#C6B8A8'/>
      <stop offset='100%' stop-color='#A08B77'/>
    </linearGradient>
    <linearGradient id='skinGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#F5D0A9'/>
      <stop offset='100%' stop-color='#E0B084'/>
    </linearGradient>
    <linearGradient id='hairGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#332112'/>
      <stop offset='100%' stop-color='#1C1108'/>
    </linearGradient>
    <linearGradient id='suitGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#382618'/>
      <stop offset='100%' stop-color='#23160B'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='10' result='blur' />
      <feComposite in='SourceGraphic' in2='blur' operator='over' />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width='500' height='500' rx='250' fill='url(#bgGrad)' />
  
  <!-- Outer Decorative Ring -->
  <circle cx='250' cy='250' r='240' fill='none' stroke='url(#goldGrad)' stroke-width='4' opacity='0.8' />
  <circle cx='250' cy='250' r='230' fill='none' stroke='#C6B8A8' stroke-width='1' stroke-dasharray='8 6' opacity='0.4' />

  <!-- Data Analytics Grid Accent in Background -->
  <g opacity='0.15' stroke='#C6B8A8' stroke-width='1'>
    <line x1='100' y1='120' x2='400' y2='120' />
    <line x1='100' y1='180' x2='400' y2='180' />
    <line x1='100' y1='240' x2='400' y2='240' />
    <line x1='100' y1='300' x2='400' y2='300' />
    <path d='M120 280 L180 220 L240 250 L310 160 L380 190' fill='none' stroke='url(#goldGrad)' stroke-width='3' opacity='0.8'/>
  </g>

  <!-- Glowing Backdrop Aura -->
  <circle cx='250' cy='210' r='110' fill='#A08B77' opacity='0.15' filter='url(#glow)' />

  <!-- Back Hair -->
  <path d='M160 210 Q250 110 340 210 Q360 310 330 380 Q250 410 170 380 Q140 310 160 210 Z' fill='url(#hairGrad)' />

  <!-- Neck -->
  <rect x='225' y='270' width='50' height='60' rx='10' fill='url(#skinGrad)' />
  <!-- Neck shadow -->
  <path d='M225 270 Q250 290 275 270 L275 285 Q250 300 225 285 Z' fill='#C89668' opacity='0.6' />

  <!-- Head / Face -->
  <ellipse cx='250' cy='215' rx='65' ry='80' fill='url(#skinGrad)' />

  <!-- Ears -->
  <circle cx='182' cy='220' r='12' fill='url(#skinGrad)' />
  <circle cx='318' cy='220' r='12' fill='url(#skinGrad)' />

  <!-- Front Hair & Styling -->
  <path d='M185 195 C180 130, 320 130, 315 195 C300 155, 200 155, 185 195 Z' fill='url(#hairGrad)' />
  <path d='M185 190 Q220 160 250 190 Q230 150 185 190 Z' fill='url(#hairGrad)' />
  <path d='M315 190 Q280 160 250 190 Q270 150 315 190 Z' fill='url(#hairGrad)' />

  <!-- Eyebrows -->
  <path d='M205 192 Q220 186 235 192' fill='none' stroke='#2C1D11' stroke-width='3.5' stroke-linecap='round' />
  <path d='M265 192 Q280 186 295 192' fill='none' stroke='#2C1D11' stroke-width='3.5' stroke-linecap='round' />

  <!-- Eyes -->
  <ellipse cx='220' cy='210' rx='8' ry='6' fill='#1A0F0A' />
  <ellipse cx='280' cy='210' rx='8' ry='6' fill='#1A0F0A' />
  <circle cx='222' cy='208' r='2.5' fill='#FFFFFF' />
  <circle cx='282' cy='208' r='2.5' fill='#FFFFFF' />

  <!-- Glasses (Modern Warm Bronze Wireframes) -->
  <rect x='200' y='198' width='38' height='26' rx='8' fill='none' stroke='url(#goldGrad)' stroke-width='2.5' />
  <rect x='262' y='198' width='38' height='26' rx='8' fill='none' stroke='url(#goldGrad)' stroke-width='2.5' />
  <line x1='238' y1='210' x2='262' y2='210' stroke='url(#goldGrad)' stroke-width='2.5' />
  <line x1='182' y1='208' x2='200' y2='208' stroke='url(#goldGrad)' stroke-width='2' />
  <line x1='300' y1='208' x2='318' y2='208' stroke='url(#goldGrad)' stroke-width='2' />

  <!-- Nose -->
  <path d='M250 212 L246 232 Q250 236 254 232' fill='none' stroke='#C89668' stroke-width='2.5' stroke-linecap='round' />

  <!-- Smile / Lips -->
  <path d='M232 252 Q250 268 268 252' fill='none' stroke='#B85C5C' stroke-width='3.5' stroke-linecap='round' />

  <!-- Professional Blazer / Torso -->
  <path d='M140 450 L170 340 Q250 310 330 340 L360 450 Z' fill='url(#suitGrad)' />
  
  <!-- Inner Blouse / Top -->
  <polygon points='225,325 275,325 260,390 240,390' fill='#EDECE9' />
  
  <!-- Lapels -->
  <path d='M170 340 L225 390 L200 450' fill='none' stroke='url(#goldGrad)' stroke-width='3' />
  <path d='M330 340 L275 390 L300 450' fill='none' stroke='url(#goldGrad)' stroke-width='3' />

  <!-- Name / Title Badge Overlay at bottom -->
  <g transform='translate(130, 410)'>
    <rect width='240' height='48' rx='24' fill='rgba(35, 22, 11, 0.94)' stroke='url(#goldGrad)' stroke-width='1.5' />
    <text x='120' y='22' text-anchor='middle' fill='#EDECE9' font-family='Plus Jakarta Sans, sans-serif' font-weight='800' font-size='13' letter-spacing='0.5'>MATHUUMITHA T.</text>
    <text x='120' y='36' text-anchor='middle' fill='#C6B8A8' font-family='JetBrains Mono, monospace' font-weight='700' font-size='10' letter-spacing='1'>DATA ANALYST</text>
  </g>
</svg>
